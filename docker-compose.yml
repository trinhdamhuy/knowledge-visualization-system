name: knovion

services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    command: tunnel run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - knovion-network

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: knovion-vector-store
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PGVECTOR_DATA_DIR}:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    networks:
      - knovion-network

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA_DIR}:/root/.ollama
      - ./scripts/run-ollama.sh:/run-ollama.sh
    entrypoint: ["/bin/bash", "/run-ollama.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - knovion-network

  backend:
    container_name: knovion-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      FRONTEND_URL: http://nginx:80
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
      pgvector:
        condition: service_started
    restart: unless-stopped
    networks:
      - knovion-network

  database:
    image: postgres:18
    container_name: knovion-database
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    restart: unless-stopped
    networks:
      - knovion-network
    volumes:
      - ${DATABASE_DATA_DIR}:/var/lib/postgresql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        AWS_ENDPOINT: ${AWS_ENDPOINT}
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    depends_on:
      - database
      - backend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      BACKEND_URL: http://backend:8000
      AUTH_URL: ${AUTH_URL:-http://localhost}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      DISABLE_ERD: ${DISABLE_ERD}
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@host.docker.internal:${DATABASE_PORT}/${DATABASE_NAME}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LIVEBLOCKS_SECRET_KEY: ${LIVEBLOCKS_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - knovion-network

  nginx:
    image: nginx:latest
    container_name: knovion-nginx
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME}
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"      # HTTP (redirect to HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # ← Mount SSL certificates
    restart: unless-stopped
    networks:
      - knovion-network

networks:
  knovion-network:
    driver: bridge