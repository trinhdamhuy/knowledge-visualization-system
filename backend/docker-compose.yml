name: knowledge-visualization

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: knovion-chat-store
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgvector:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    networks:
      - knovion-network

  chatbot-api:
    build: .
    container_name: knovion-chatbot-api
    environment:
      FRONTEND_URL: ${FRONTEND_URL}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}

      LIVEBLOCKS_SECRET_KEY: ${LIVEBLOCKS_SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - pgvector
    restart: unless-stopped
    networks:
      - knovion-network

networks:
  knovion-network:
    driver: bridge

volumes:
  pgvector:
    name: knovion-chat-store